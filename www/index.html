const ema=(a,n)=>{const k=2/(n+1);let e=a[0];return a.map((x,i)=>i?e=x*k+e*(1-k):e)};

function bbw(c,i){const s=c.slice(i-19,i+1),m=avg(s,20),q=Math.sqrt(s.reduce((a,b)=>a+(b-m)**2,0)/20);return{m,u:m+2*q,l:m-2*q,w:4*q/m}}

// BAZ KIRILIMI: son 30 günde dar bant (yükseklik < 4,5×ATR) + 30g zirve aşılır + fiyat SMA50 üstü (60 hisse/3 yıl testinde evreni 20g'de ~%1,4 geçti; parametreye duyarlı)
const aT=(i,m=14)=>{let s=0;for(let k=i-m+1;k<=i;k++)s+=Math.max(H[k]-W[k],Math.abs(H[k]-C[k-1]),Math.abs(W[k]-C[k-1]));return s/m},s50=k=>avg(C.slice(0,k+1),50),

function ind(d){const c=d.map(x=>x.c),n=c.length-1,R=rsi(c),e12=ema(c,12),e26=ema(c,26),m=e12.map((x,i)=>x-e26[i]),sg=ema(m,9),h=m.map((x,i)=>x-sg[i]),b=bbw(c,n),pb=(c[n]-b.l)/(b.u-b.l);

<div class="card scroll"><h3>Pozisyonlar${v=='p'?' · nakit '+TL(S.cash):''}</h3><table>${PH}${I.map(o=>prow(o.i,v=='r'?`<button data-a="pd:${o.p.id}" style="padding:4px 8px">✕</button>`:`<button data-a="ps:${o.p.id}" style="padding:4px 8px">Sat</button>`)).join('')}</table></div>
<div class="card"><h3>${v=='r'?'Öneriler':'Gösterge ne diyor?'}</h3>${adv.map(({o,a})=>`<div style="margin-bottom:8px"><b>${o.i.t}</b> ${a.map(x=>`<span class="pl ${x[1]}" style="min-width:0;padding:2px 7px;margin-left:3px">${x[0]}</span>`).join('')}<div class="note">${a.map(x=>x[2]).join(' ')}</div></div>`).join('')}${(()=>{const sc={};I.forEach(o=>{const k=secOf(o.i.t);if(k)sc[k]=(sc[k]||0)+o.i.val});const top=Object.entries(sc).sort((a,b)=>b[1]-a[1])[0],mine=new Set(I.map(o=>o.i.t)),pick=rows().filter(o=>o.lq!==0&&/AL/.test(o.sg[0])&&!mine.has(o.t)).sort((a,b)=>b.c-a.c).slice(0,3);
return(top&&top[1]/tv>.4?`<div class="note">⚠ Portföyün %${f(top[1]/tv*100,0)} kadarı tek sektörde (${top[0]}); çeşitlendirmeyi düşün.</div>`:'')+(I.length<4?'<div class="note">⚠ Az sayıda hisse var; 5-8 farklı hisse riski dağıtır.</div>':'')+(pick.length?`<div class="note">Portföyünde olmayan AL sinyalleri: <b>${pick.map(o=>o.t).join(', ')}</b></div>`:'')})()}<div class="note">Öneriler gösterge çıktısıdır, kişisel yatırım tavsiyesi değildir. Durum: STOP = zirveden 2,5×ATR geri çekilme; ZAYIF = trend skoru SAT.</div></div>`}
if(v=='p'){h+=(S.log.length?`<div class="card"><h3>Kapanan işlemler</h3><table>${S.log.slice(-8).reverse().map(l=>`<tr><td><b>${l.t}</b></td><td>${dmy(l.d)}→${dmy(l.xd)}</td><td>${pc(l.pl)}</td></tr>`).join('')}</table></div>`:'')+'<button data-a="pr" style="margin-bottom:8px">Sıfırla (tüm hisseleri sil)</button>'}
const el=$('#pfl');if(el)el.innerHTML=h}
function pfAdd(){const t=$('#pf_t').value.trim().toUpperCase(),q=+$('#pf_q').value,d=$('#pf_d').value;let p=+$('#pf_p').value;if(!t||!(q>0)||!d)return alert('Hisse, adet ve tarih gerekli.');load(t).then(b=>{if(!b)return alert(t+' için veri alınamadı.');if(!(p>0))p=b[b.length-1].c;
if(PT.v=='r')PF.real.push({id:Date.now(),t,q,p,d});else{const c=q*p*(1+FEE);if(c>PF.paper.cash)return alert('Nakit yetersiz: '+TL(PF.paper.cash));PF.paper.cash-=c;if(!PF.paper.start)PF.paper.start=d;PF.paper.pos.push({id:Date.now(),t,q,p,d})}pfSave();port()})}
function paperSell(id){const S=PF.paper,i=S.pos.findIndex(p=>p.id==id);if(i<0)return;const p=S.pos[i],c=lastB(p.t).c,pr=p.q*c*(1-FEE);S.cash+=pr;S.log.push({t:p.t,q:p.q,p:p.p,x:c,d:p.d,xd:today(),pl:pr/(p.q*p.p*(1+FEE))-1});S.pos.splice(i,1);pfSave();port()}
async function refreshAll(){if(RFL)return;RFL=1;const rb=$('#rfb');rb.classList.add('spin');const keep=new Set([ST.t,...PF.real.map(p=>p.t),...PF.paper.pos.map(p=>p.t)]),reload=async L=>{const old={...D},os={...SRC};await Promise.all(L.map(async t=>{delete D[t];if(!(await load(t))&&old[t]){D[t]=old[t];SRC[t]=os[t]}}))};
await loadScan();if(SCAN)await reload([...keep]);else{await reload(Object.keys(D));const Lm=Math.min(...U.map(t=>D[t].length));UR.length=0;for(let i=1;i<Lm;i++)UR.push(U.reduce((s,t)=>{const c=D[t],j=c.length-Lm+i;return s+c[j].c/c[j-1].c-1},0)/U.length)}
LR0=Date.now();LR=clk();LBT=0;if(RF.m=='i')loadAllI();home();radar();mac();if($('#v2').classList.contains('on'))stock();if($('#v3').classList.contains('on'))port();rb.classList.remove('spin');RFL=0}
function mac(){const b=SCAN?SCAN.br:null,reg=MKT?['Olumlu','g','Genel eğilim yukarı: normal temkinle devam.']:['Zayıf','r','Piyasa 100 günlük ortalamanın altında: skorlar 15 puan düşürülür, yeni alımda daha temkinli ol.'];
$('#v4').innerHTML=`<div class="card"><h3>Piyasa durumu</h3><div class="grid"><div class="kv"><span>Rejim</span><b class="${reg[1]}">${reg[0]}</b></div>${b?`<div class="kv"><span>SMA50 üstü</span><b>%${f(b.a50*100,0)}</b></div><div class="kv"><span>SMA200 üstü</span><b>%${f(b.a200*100,0)}</b></div>`:''}</div><div class="note" style="margin-top:6px">${reg[2]} Rejim: eşit ağırlıklı likit hisse endeksi 100 günlük ortalamasının üstünde mi? Yüzdeler: hisselerin kaçı kendi ortalamasının üstünde.</div></div>
<div class="card"><h3>Aracı kurum görünümü · ${RPT.tarih}</h3>BIST 100 destek <b class="g">${RPT.bist.sup.map(v=>f(v,0)).join(' · ')}</b><br>direnç <b class="r">${RPT.bist.res.map(v=>f(v,0)).join(' · ')}</b><div class="note" style="margin-top:6px">${RPT.bist.y}</div></div>
<div class="card"><h3>Geriye dönük test</h3><div class="note" style="margin-bottom:8px">Skorun geçmişte işe yarayıp yaramadığını gerçek veriyle ölçer (yaklaşık 15 sn sürer).</div><button class="pr" data-a="bt">TESTİ ÇALIŞTIR</button></div><div id="bo"></div>
<div class="card"><h3>Veri kaynakları</h3><div class="note">Hisse listesi TradingView tarayıcısından, fiyat ve temettü Yahoo Finance'ten alınır. GitHub, seans saatlerinde 30 dakikada bir tüm BIST'i hesaplayıp yayınlar; hisse detayı ve portföy fiyatları doğrudan Yahoo'dan canlı çekilir. Sahte veri kullanılmaz.</div></div>`}
const NV=[['⌂','Ana Sayfa'],['☰','Radar'],['◩','Hisse'],['▣','Portföy'],['◔','Piyasa']];
function go(i){if(i==1&&LR0&&Date.now()-LR0>60000)refreshAll();if(i==3)port();document.querySelectorAll('.v').forEach((e,k)=>e.classList.toggle('on',k==i));$('#nv').innerHTML=NV.map((n,k)=>`<button class="${k==i?'on':''}" data-a="go:${k}"><b>${n[0]}</b>${n[1]}</button>`).join('');scrollTo(0,0)}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const[a,v,w]=el.dataset.a.split(':');
if(a=='go')go(+v);else if(a=='o'){ST.t=v;ST.tab='g';go(2);stock()}else if(a=='tab'){ST.tab=v;stock()}else if(a=='per'){ST.per=+v;stock()}else if(a=='rf'){RF.f=v;radar()}else if(a=='so'){RF.s=v;radar()}
else if(a=='qk'){RF.f=v=='rep'?'rep':v=='kr'?'brk':v=='dv'?'dv':'all';RF.s='c';RF.m=v=='st'?'i':'d';radar();go(1)}else if(a=='q'||a=='q2'){const t=$(a=='q'?'#q':'#tk').value.trim().toUpperCase();if(t){ST.t=t;ST.tab='g';go(2);stock()}}
else if(a=='rf0')refreshAll();else if(a=='pt'){PT.v=v;port()}else if(a=='pa')pfAdd();else if(a=='pd'){PF.real=PF.real.filter(p=>p.id!=v);pfSave();port()}else if(a=='pr'){if(confirm('Yapay portföy sıfırlansın mı? Tüm hisseler silinir.')){PF.paper=NP();pfSave();port()}}else if(a=='ps')paperSell(v);else if(a=='more'){RQ.lim+=100;radarList()}else if(a=='pfa'){ST.t=v;if(w)PT.v=w;go(3)}else if(a=='md'){RF.m=v;radar()}else if(a=='ri')loadAllI();else if(a=='rt')location.reload();else if(a=='bt')btRun()});
let ty=-1,pd=0;addEventListener('touchstart',e=>{ty=scrollY<=0?e.touches[0].clientY:-1},{passive:true});
addEventListener('touchmove',e=>{if(ty<0)return;pd=e.touches[0].clientY-ty;const b=$('#ptr');b.style.height=pd>10?Math.min(44,pd/2.5)+'px':'0';b.textContent=pd>110?'Bırak: yenileniyor':pd>10?'↓ Yenilemek için çek':''},{passive:true});
addEventListener('touchend',()=>{if(ty>=0&&pd>110)refreshAll();const b=$('#ptr');b.style.height='0';b.textContent='';ty=-1;pd=0});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&LR0&&Date.now()-LR0>300000)refreshAll()});
const dl=()=>$('#ul').innerHTML=(SCAN?SCAN.rows.map(r=>r.t):U).map(u=>`<option value="${u}">`).join('');dl();addEventListener('input',e=>{if(e.target.id=='rq'){RQ.q=e.target.value;RQ.lim=100;radarList()}});go(0);pfInit();mac();
async function localInit(){await Promise.all(U.map(load));for(let i=U.length-1;i>=0;i--)if(!D[U[i]])U.splice(i,1);
if(!U.length){$('#src').textContent='Veri yok';$('#v0').innerHTML=$('#v1').innerHTML='<div class="card"><b class="r">Gerçek veri alınamadı.</b><div class="note" style="margin:6px 0">Tarama dosyası ve Yahoo denendi. Uygulama sahte veri göstermez. İnternet varsa tekrar dene.</div><button class="pr" data-a="rt">TEKRAR DENE</button></div>';return false}
const Lm=Math.min(...U.map(t=>D[t].length));for(let i=1;i<Lm;i++)UR.push(U.reduce((s,t)=>{const c=D[t],j=c.length-Lm+i;return s+c[j].c/c[j-1].c-1},0)/U.length);return true}
(async()=>{let ok=await loadScan();if(!ok)ok=await localInit();if(!ok)return;dl();LR0=Date.now();LR=clk();home();radar();mac();port()})();
</script></body></html>
