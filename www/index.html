<script>
const $=s=>document.querySelector(s),U=['AEFES','AKBNK','AKSEN','ALARK','ARCLK','ASELS','ASTOR','BIMAS','BRSAN','BTCIM','CCOLA','CIMSA','DOAS','DOHOL','ECILC','EGEEN','EKGYO','ENJSA','ENKAI','EREGL','FROTO','GARAN','GUBRF','HALKB','HEKTS','ISCTR','ISMEN','KCHOL','KONTR','KRDMD','MAVI','MGROS','MPARK','ODAS','OTKAR','OYAKC','PETKM','PGSUS','SAHOL','SASA','SISE','SOKM','TABGD','TAVHL','TCELL','THYAO','TKFEN','TOASO','TSKB','TTKOM','TUPRS','ULKER','VAKBN','VESTL','YKBNK','KOZAL','AGHOL','AKSA','ALFAS','ANHYT','BRYAT'],BANK=['GARAN','AKBNK','YKBNK'];
// ZİRAAT YATIRIM TEKNİK ANALİZ RAPORU (7 Ekim 2026) — günlük güncellenebilir veri bloğu
const RPT={tarih:'7 Ekim 2026',
rec:{GARAN:{c:131.2,s1:135.2,s2:135.5,stop:129.9},OTKAR:{c:341.25,s1:351.5,s2:352,stop:337},TABGD:{c:224.9,s1:231.7,s2:232.1,stop:222.7}},
sum:{GARAN:{beta:1.18,z:.26,wk:127.32,mo:130.52,hi:131.4,lo:122.5,vol:2285,vm:4283},OTKAR:{beta:.67,z:.06,wk:322.6,mo:312.43,hi:357,lo:275,vol:316,vm:140},TABGD:{beta:.62,z:0,wk:222.2,mo:226.24,hi:229,lo:210.9,vol:71,vm:161}},
idx:[['XU100','BIST 100',12374,-.56,.7,-11.7,15.3],['XBANK','BIST Banka',16188,.66,.3,-2.5,11.9],['XUSIN','BIST Sınai',15864,-1.21,-1.5,-17.5,13.7],['XTUMY','BIST Tüm-100',48631,-1.13,-5.4,-34.8,-7.6]],
bist:{sup:[12260,12180,12085],res:[12440,12575,12680],y:'Endeks kısa vadeli ortalamaların üzerinde ama hacim düşük. 12.260 üstünde kalındıkça 12.440 direnci denenebilir; aksi halde ana destek 12.085. Yatay açılış bekleniyor.'}
};
const REG=(()=>{const x=RPT.idx[0];return Math.max(-60,Math.min(60,(x[2]>RPT.bist.sup[0]?15:-25)+x[5]*1.5+x[4]*3))})();
const D={},SRC={};let M={faiz:0,enf:0,risk:0,kur:0},UR=[],RF={f:'all',s:'c',m:'d'},ST={t:'THYAO',tab:'g',per:66};
const f=(x,d=2)=>Number(x).toLocaleString('tr-TR',{minimumFractionDigits:d,maximumFractionDigits:d}),cl=(x,a=100)=>Math.max(-a,Math.min(a,x)),avg=(a,n)=>a.slice(-n).reduce((x,y)=>x+y,0)/Math.min(n,a.length),col=x=>x>0?'g':x<0?'r':'m';
const sd=(a,n)=>{const s=a.slice(-n),m=avg(s,n);return Math.sqrt(s.reduce((x,y)=>x+(y-m)**2,0)/s.length)||1},zs=(c,n)=>(c[c.length-1]-avg(c,n))/sd(c,n);
const Y=t=>t.includes('.')||t.includes('^')?t:t+'.IS';
async function J(u,x){const r=await fetch(u);if(!r.ok)throw 0;return x?r.text():r.json()}
const SRCF={
Yahoo:async t=>{let e;for(const h of['query1','query2']){try{const j=await J('https://'+h+'.finance.yahoo.com/v8/finance/chart/'+Y(t)+'?range=3y&interval=1d'),q=j.chart.result[0],z=q.indicators.quote[0];return q.timestamp.map((s,i)=>({t:s,o:z.open[i],c:z.close[i],h:z.high[i],l:z.low[i],v:z.volume[i]||1}))}catch(x){e=x}}throw e},
Stooq:async t=>(await J('https://stooq.com/q/d/l/?s='+t.toLowerCase()+'.tr&i=d',1)).trim().split('\n').slice(1).map(l=>{const a=l.split(',');return{t:Date.parse(a[0])/1000,o:+a[1],h:+a[2],l:+a[3],c:+a[4],v:+a[5]||1}}),
'Arşiv':t=>J('data/'+t+'.json')};
async function load(t){if(D[t])return D[t];for(const k of['Yahoo','Stooq','Arşiv']){try{const d=(await SRCF[k](t)).filter(b=>b.c>0&&b.o>0&&b.h>0&&b.l>0);if(d.length>=260){D[t]=d;SRC[t]=k;return d}}catch(e){}}SRC[t]='YOK';return null}
const ema=(a,n)=>{const k=2/(n+1);let e=a[0];return a.map((x,i)=>i?e=x*k+e*(1-k):e)};
function rsi(c,n=14){const o=Array(c.length).fill(null);let g=0,l=0;for(let i=1;i<c.length;i++){const d=c[i]-c[i-1],u=Math.max(d,0),w=Math.max(-d,0);if(i<=n){g+=u/n;l+=w/n}else{g=(g*(n-1)+u)/n;l=(l*(n-1)+w)/n}if(i>=n)o[i]=l==0?100:100-100/(1+g/l)}return o}
function atr(d,n=14){let a=0;const s=d.slice(-n-1);for(let i=1;i<s.length;i++)a+=Math.max(s[i].h-s[i].l,Math.abs(s[i].h-s[i-1].c),Math.abs(s[i].l-s[i-1].c));return a/n}
function bbw(c,i){const s=c.slice(i-19,i+1),m=avg(s,20),q=Math.sqrt(s.reduce((a,b)=>a+(b-m)**2,0)/20);return{m,u:m+2*q,l:m-2*q,w:4*q/m}}
let XS=null,MKT=1,LR0=0,RFL=0,LR='';
const zq=(v,k)=>XS?cl((v-XS[k][0])/XS[k][1],2.5):0,clk=()=>new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
const mkXS=KS=>{const m=k=>{const q=KS.map(x=>x[k]);return[avg(q,999),sd(q,999)]};return{m:m('mom121'),n:m('nh'),v:m('sd60'),u:m('up120')}};
const mkMKT=A_=>{const Lm=Math.min(...A_.map(c=>c.length)),ix=[];for(let k=Lm-100;k<Lm;k++)ix.push(A_.reduce((s,c)=>s+c[c.length-Lm+k].c/c[c.length-Lm].c,0)/A_.length);return ix[99]>avg(ix,100)?1:0};
// Kaliteli momentum (QM) bileşenleri + kırılma/giriş zamanlaması (60 hisse, 3 yıl gerçek veriyle test edildi)
function BK(d,n){const H=d.map(b=>b.h),W=d.map(b=>b.l),C=d.map(b=>b.c),V=d.map(b=>b.v),mxa=(a,i,k)=>Math.max(...a.slice(Math.max(0,i-k+1),i+1)),mna=(a,i,k)=>Math.min(...a.slice(Math.max(0,i-k+1),i+1)),av=i=>avg(V.slice(0,i),20)||1,
brk=k=>C[k]>mxa(H,k-1,20)?1:C[k]<mna(W,k-1,20)?-1:0,vr=V[n]/av(n),don=brk(n),b3=[0,1,2].map(j=>brk(n-j)).reduce((a,b)=>Math.abs(b)>Math.abs(a)?b:a,0);
let up=null,dn=null;for(let k=n-1;k>=n-10;k--){if(!up&&brk(k)==1)up={k,lv:mxa(H,k-1,20)};if(!dn&&brk(k)==-1)dn={k,lv:mna(W,k-1,20)}}
const at=atr(d),p=C[n],dr=k=>C[k]/C[k-1]-1,rs=m=>{const a=[];for(let k=n-m+1;k<=n;k++)a.push(dr(k));return a},r60=rs(60),m60=avg(r60,60),s60=Math.sqrt(r60.reduce((s,x)=>s+(x-m60)**2,0)/60),u120=rs(120).filter(x=>x>0).length/120;
return{don,bkq:don*Math.min(vr,3),b3,bull:up&&n-up.k<=5&&p<up.lv?1:0,bear:dn&&n-dn.k<=5&&p>dn.lv?1:0,held:up&&p>=up.lv&&don<1?1:0,retest:up&&p>=up.lv&&p<=up.lv+.75*at?1:0,h20:mxa(H,n-1,20),l20:mna(W,n-1,20),h55:mxa(H,n-1,55),l55:mna(W,n-1,55),vr20:vr,mom121:C[n-21]/C[Math.max(0,n-252)]-1,nh:p/mxa(C,n,252),sd60:s60,up120:u120,d50:(p-avg(C,50))/sd(C,50)}}
function ind(d){const c=d.map(x=>x.c),n=c.length-1,R=rsi(c),e12=ema(c,12),e26=ema(c,26),m=e12.map((x,i)=>x-e26[i]),sg=ema(m,9),h=m.map((x,i)=>x-sg[i]),b=bbw(c,n),pb=(c[n]-b.l)/(b.u-b.l);
const ws=[];for(let j=Math.max(19,n-120);j<=n;j++)ws.push(bbw(c,j).w);const pct=ws.filter(x=>x<b.w).length/ws.length*100;
const tei=(c[n]-c[n-20])/c.slice(n-19).reduce((s,x,k)=>s+Math.abs(x-c[n-20+k]),0); // ÖZEL 1 Trend Verimliliği
const vsp=(100-pct)/100*Math.sign(c[n]-b.m); // ÖZEL 2 Sıkışma Baskısı
const s50=avg(c,50),vv=d.map(x=>x.v),vr=avg(vv,5)/avg(vv,50),vwe=(c[n]-s50)/sd(c,50)*vr; // ÖZEL 3 Hacim Ağırlıklı Yorgunluk
const z=(zs(c,21)+zs(c,63)+zs(c,250))/3,L=d[n],P=(L.h+L.l+L.c)/3,y=d.slice(-250);// Z-Skor: rapordaki yöntem (1-3-12 ay ort.)
return{c,n,r:R[n],R,h:h[n],hp:h[n-1],pb,b,pct,tei,vsp,vwe,vr,z,s5:avg(c,5),s20:avg(c,20),s21:avg(c,21),s50,s200:avg(c,200),p:c[n],mom:c[n]/c[Math.max(0,n-250)]-1,d1:c[n]/c[n-1]-1,at:atr(d),hi:Math.max(...y.map(x=>x.h)),lo:Math.min(...y.map(x=>x.l)),dh:L.h,dl:L.l,pv:{R2:P+L.h-L.l,R1:2*P-L.l,S1:2*P-L.h,S2:P-(L.h-L.l)},...BK(d,n)}}
function beta(t){if(RPT.sum[t])return RPT.sum[t].beta;const c=D[t].map(x=>x.c),n=Math.min(250,UR.length,c.length-2),a=[],b=[];for(let i=0;i<n;i++){a.push(c[c.length-1-i]/c[c.length-2-i]-1);b.push(UR[UR.length-1-i])}const ma=avg(a,n),mb=avg(b,n);let cv=0,vr=0;for(let i=0;i<n;i++){cv+=(a[i]-ma)*(b[i]-mb);vr+=(b[i]-mb)**2}return cv/vr}
function macro(t){const w=BANK.includes(t)?2.5:1.5;return cl((M.faiz*w+M.enf+M.risk*1.5+M.kur)/10*100+REG)}
function score(d,t,rs=0,live=true,x0){const x=x0||ind(d),s=zq(x.mom121,'m')+zq(x.nh,'n')-zq(x.sd60,'v')+zq(x.up120,'u'),mc=live?macro(t):0,
lt=cl(15*s+(MKT?0:-15)+mc*.2),st=cl((x.r>65?-25:15)+(x.d50>1.5?-25:15)+(x.don==1?-20:0)+(x.d50<0?10:0)+(MKT?10:-10));
return{st,lt,mc,rk:RPT.rec[t]?1:0,x,sg:sig2(lt,st),c:lt+.3*st}}
const sig=v=>v>40?['GÜÇLÜ AL','g']:v>15?['AL','g']:v<-40?['GÜÇLÜ SAT','r']:v<-15?['SAT','r']:['İZLE','a'],pl=v=>{const[a,c]=sig(v);return`<span class="pl ${c}">${a}</span>`},ch=(l,a,on)=>`<button class="ch ${on?'on':''}" data-a="${a}">${l}</button>`;
const sig2=(u,k)=>u>40&&k>0?['GÜÇLÜ AL','g']:u>15&&k>0?['AL','g']:u>15?['BEKLE','a']:u<-15?['SAT','r']:['İZLE','m'],pls=o=>`<span class="pl ${o.sg[1]}">${o.sg[0]}</span>`;
function rows(){const KS=U.map(t=>ind(D[t]));XS=mkXS(KS);MKT=mkMKT(U.map(t=>D[t]));return U.map((t,i)=>{const sc=score(D[t],t,0,true,KS[i]);return{t,sc,x:sc.x,st:sc.st,lt:sc.lt,sg:sc.sg,c:sc.c}})}
function home(){const R=rows().sort((a,b)=>b.c-a.c),top=R.slice(0,3),bot=R.slice(-3).reverse(),cd=o=>`<div class="kv" data-a="o:${o.t}" style="cursor:pointer"><b>${o.t}</b>${pls(o)}<span class="${col(o.x.d1)}">${f(o.x.d1*100)}%</span></div>`;
$('#v0').innerHTML=`<div class="row"><input id="q" placeholder="Hisse ara (ör. THYAO)" list="ul"><button class="pr" data-a="q">ARA</button></div>
<div class="qk">${[['⚡','Hızlı Tarama','c'],['📈','Kısa Vade','st'],['🏦','Uzun Vade','lt'],['📋','Rapor Listesi','rep']].map(([i,l,k])=>`<button data-a="qk:${k}"><span>${i}</span>${l}</button>`).join('')}</div>
<h3>Piyasa özeti · Ziraat Yatırım ${RPT.tarih}</h3><div class="tiles">${RPT.idx.map(i=>`<div class="tile"><span class="m">${i[1]}</span><b>${f(i[2],0)}</b><span class="${col(i[3])}">${i[3]>0?'+':''}${f(i[3])}% · Ay ${f(i[5],1)}%</span></div>`).join('')}</div>
<div class="card"><h3>Aracı kurum günlük öneri listesi × bizim skor</h3><table><thead><tr><th>Hisse</th><th>Kapanış</th><th>Satış</th><th>Stop</th><th>Skor</th></tr></thead>${Object.entries(RPT.rec).map(([t,r])=>`<tr data-a="o:${t}"><td><b>${t}</b></td><td>${f(r.c)}</td><td class="g">${f(r.s1)}</td><td class="r">${f(r.stop)}</td><td>${R.find(o=>o.t==t)?pls(R.find(o=>o.t==t)):'-'}</td></tr>`).join('')}</table></div>
<div class="card"><h3>BIST 100 seviyeleri</h3>Destek <b class="g">${RPT.bist.sup.map(v=>f(v,0)).join(' · ')}</b><br>Direnç <b class="r">${RPT.bist.res.map(v=>f(v,0)).join(' · ')}</b><div class="note" style="margin-top:6px">${RPT.bist.y}</div></div>

function radar(){if(RF.m=='i'){radarI();return}const A=rows(),R=A.filter(o=>RF.f=='all'||(RF.f=='al'&&/AL/.test(o.sg[0]))||(RF.f=='iz'&&o.sg[0]=='İZLE')||(RF.f=='bk'&&o.sg[0]=='BEKLE')||(RF.f=='sa'&&o.sg[0]=='SAT')||(RF.f=='rep'&&RPT.rec[o.t])||(RF.f=='kr'&&o.x.b3)).sort((a,b)=>b[RF.s]-a[RF.s]);

for(let r=0;r<6;r++){const k=rk(),pk=[...U].sort(()=>Math.random()-.5).slice(0,4),ret=(t,h)=>{const c=D[t],i=c.length-1-k;return c[i+h].c/c[i].c-1};tr.push({k,pk,s:mu(pk.map(t=>ret(t,20))),l:mu(pk.map(t=>ret(t,120))),us:mu(U.map(t=>ret(t,20))),ul:mu(U.map(t=>ret(t,120)))})}
$('#bo').innerHTML=`<div class="card"><h3>Skor geçmişte işe yaradı mı? (${U.length} hisse, gerçek veri)</h3><table><thead><tr><th>Grup</th><th>20 gün</th><th>60 gün</th></tr></thead>${G.map(([n,fn])=>`<tr><td>${n}</td><td>${cell(grp(20,fn))}</td><td>${cell(grp(60,fn))}</td></tr>`).join('')}</table><div class="note" style="margin-top:6px">Değerler evrene göre fark (puan). Parantez: evreni geçme oranı · test tarihi sayısı. Evren ortalaması: 20g ${u20?P(u20.g):'-'}, 60g ${u60?P(u60.g):'-'}.</div><div style="margin-top:8px"><b class="${ok?'g':'a'}">${ok?'✅ En güçlü %20, 60 günde evreni geçti.':'⚠ Kanıt zayıf: sinyale güvenme.'}</b> ${ab?'AL grubu 60g: '+P(ab.g-ab.u)+' fark.':''}</div></div>
<div class="card"><h3>İndikatörsüz rastgele alım (6 deneme)</h3>${tr.map(o=>`<div class="kv" style="margin-bottom:6px"><b>${o.k} gün önce</b> · ${o.pk.join(' ')}<br>20g ${P(o.s)} · 120g ${P(o.l)} <span class="m">(evren ${P(o.us)} / ${P(o.ul)})</span></div>`).join('')}<div class="note">Ortalama: 20g ${P(mu(tr.map(o=>o.s)))} · 120g ${P(mu(tr.map(o=>o.l)))}. Karşılaştırma için: skorlu seçim yukarıdaki tabloda.</div></div>`}
// ===== PORTFÖY (gerçek + yapay) =====
const FEE=.001,PT={v:'r'};let PF={real:[],paper:{K:null,U:null}};
const pfLoad=()=>{try{const j=JSON.parse(localStorage.getItem('btpf1'));if(j)PF=j}catch(e){}},pfSave=()=>{try{localStorage.setItem('btpf1',JSON.stringify(PF))}catch(e){}},pfInit=()=>pfLoad();
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10),lastB=t=>D[t][D[t].length-1],bDate=b=>new Date((b.t+10800)*1000).toISOString().slice(0,10),dmy=d=>d.split('-').reverse().join('.'),pc=v=>`<span class="${col(v)}">${v>0?'+':''}${f(v*100)}%</span>`,TL=v=>f(v,0)+' ₺';
function posRow(t,q,p,dts,extra){const d=D[t];if(!d)return{h:`<tr><td><b>${t}</b></td><td colspan="4" class="r">veri yok</td><td></td></tr>`,val:0,cost:0};const cur=d[d.length-1].c,ts=Date.parse(dts+'T00:00:00+03:00')/1000,hi=Math.max(p,...d.filter(b=>b.t>=ts).map(b=>b.c)),tr=hi-2.5*atr(d),sg=score(d,t).sg,st=cur<tr?['STOP','r']:sg[0]=='SAT'?['ZAYIF','a']:['TUT','g'];
return{h:`<tr><td><b>${t}</b><br><span class="m">${q} adet · ${dmy(dts)}</span></td><td>${f(p)}</td><td>${f(cur)}</td><td>${pc(cur/p-1)}<br><span class="${col(cur-p)}">${TL(q*(cur-p))}</span></td><td><span class="pl ${st[1]}">${st[0]}</span><br><span class="m">stop ${f(tr)}</span></td><td>${extra||''}</td></tr>`,val:q*cur,cost:q*p}}
const PH='<thead><tr><th>Hisse</th><th>Giriş</th><th>Güncel</th><th>K/Z</th><th>Durum</th><th></th></tr></thead>';
function paperStep(){const R=rows(),bd=bDate(lastB(U[0]));["K","U"].forEach(k=>{let S=PF.paper[k];if(!S)S=PF.paper[k]={cash:100000,start:bd,pos:[],log:[],last:'',b0:Object.fromEntries(U.map(t=>[t,lastB(t).c]))};if(S.last==bd)return;S.last=bd;const H=k=='K'?20:120;
S.pos=S.pos.filter(p=>{const o=R.find(r=>r.t==p.t);if(!o||!D[p.t])return true;const c=lastB(p.t).c;p.hi=Math.max(p.hi,c);const days=D[p.t].filter(b=>b.t>=p.ts).length-1,tr=p.hi-(k=='K'?2:3)*atr(D[p.t]),why=days>=H?'süre doldu':c<tr?'stop':(k=='U'&&o.sg[0]=='SAT')?'trend bozuldu':null;if(!why)return true;const pr=p.q*c*(1-FEE);S.cash+=pr;S.log.push({t:p.t,q:p.q,p:p.p,x:c,d:p.d,xd:bd,why,pl:pr/(p.q*p.p)-1});return false});
const eq=S.cash+S.pos.reduce((s,p)=>s+p.q*lastB(p.t).c,0),slot=eq/5;R.filter(o=>/AL/.test(o.sg[0])&&!S.pos.some(p=>p.t==o.t)).sort((a,b)=>b.lt-a.lt).forEach(o=>{if(S.pos.length>=5||S.cash<slot*.5)return;const c=o.x.p,q=Math.floor(Math.min(slot,S.cash)/(c*(1+FEE)));if(q<1)return;S.cash-=q*c*(1+FEE);S.pos.push({t:o.t,q,p:c,d:bd,ts:lastB(o.t).t,hi:c})})});pfSave()}
async function port(){const v=PT.v;$('#v3').innerHTML=`<div class="chs">${[['Gerçek','r'],['Yapay · Kısa (20g)','K'],['Yapay · Uzun (120g)','U']].map(([l,k])=>ch(l,'pt:'+k,v==k)).join('')}</div>`+(v=='r'?`<div class="card"><h3>Pozisyon ekle (gerçek portföy)</h3><div class="row"><input id="pf_t" value="${ST.t}" list="ul"><input id="pf_q" type="number" inputmode="numeric" placeholder="Adet"></div><div class="row"><input id="pf_p" type="number" step="0.01" inputmode="decimal" placeholder="Giriş fiyatı (boşsa güncel)"><input id="pf_d" type="date" value="${today()}"></div><button class="pr" data-a="pa" style="width:100%">PORTFÖYE EKLE</button></div>`:'')+'<div id="pfl"><div class="card">Yükleniyor…</div></div>';
let h='';if(v=='r'){const P=PF.real;await Promise.all(P.map(p=>load(p.t)));let tv=0,tc=0;const R_=P.map(p=>{const o=posRow(p.t,p.q,p.p,p.d,`<button data-a="pd:${p.id}" style="padding:4px 8px">✕</button>`);tv+=o.val;tc+=o.cost;return o.h});
h=P.length?`<div class="tiles"><div class="tile"><span class="m">Değer</span><b>${TL(tv)}</b><span class="m">maliyet ${TL(tc)}</span></div><div class="tile"><span class="m">Kâr/Zarar</span><b class="${col(tv-tc)}">${TL(tv-tc)}</b>${tc?pc(tv/tc-1):''}</div></div><div class="card scroll"><table>${PH}${R_.join('')}</table></div><div class="note">Durum: STOP = fiyat zirveden 2,5×ATR geri çekildi; ZAYIF = trend skoru SAT; TUT = sorun yok. Yatırım tavsiyesi değildir.</div>`:'<div class="card note">Henüz pozisyon yok. Yukarıdan hisse, adet, giriş fiyatı ve tarih girerek ekle.</div>'}
else{const S=PF.paper[v];if(!S)h='<div class="card note">Veri bekleniyor…</div>';else{const eq=S.cash+S.pos.reduce((s,p)=>s+(D[p.t]?p.q*lastB(p.t).c:p.q*p.p),0),bm=avg(U.map(t=>lastB(t).c/(S.b0[t]||lastB(t).c)-1),999),rt=eq/100000-1,R_=S.pos.map(p=>posRow(p.t,p.q,p.p,p.d).h);
h=`<div class="tiles"><div class="tile"><span class="m">Değer (başlangıç 100.000 ₺ · ${dmy(S.start)})</span><b>${TL(eq)}</b>${pc(rt)}</div><div class="tile"><span class="m">Evren ort. getirisi</span><b class="${col(bm)}">${f(bm*100)}%</b><span class="${col(rt-bm)}">fark ${f((rt-bm)*100)} puan</span></div></div><div class="card scroll"><h3>Açık pozisyonlar · nakit ${TL(S.cash)}</h3>${S.pos.length?`<table>${PH}${R_.join('')}</table>`:'<div class="note">Açık pozisyon yok (AL sinyali bekleniyor).</div>'}</div>${S.log.length?`<div class="card"><h3>Kapanan işlemler</h3><table>${S.log.slice(-8).reverse().map(l=>`<tr><td><b>${l.t}</b></td><td>${dmy(l.d)}→${dmy(l.xd)}</td><td>${pc(l.pl)}</td><td class="m">${l.why}</td></tr>`).join('')}</table></div>`:''}<div class="note">Kural: AL veren en güçlü ≤5 hisse, eşit ağırlık, %0,1 komisyon. Çıkış: ${v=='K'?'20 gün, 2×ATR stop':'120 gün, 3×ATR stop veya trend bozulması'}. Sinyalin canlı denemesidir; yeni günlük bar geldikçe işlem yapar.</div><button data-a="pr:${v}" style="margin-top:8px">Sıfırla</button>`}}
const el=$('#pfl');if(el)el.innerHTML=h}
function pfAdd(){const t=$('#pf_t').value.trim().toUpperCase(),q=+$('#pf_q').value,d=$('#pf_d').value;let p=+$('#pf_p').value;if(!t||!(q>0)||!d)return alert('Hisse, adet ve tarih gerekli.');load(t).then(b=>{if(!b)return alert(t+' için veri alınamadı.');if(!(p>0))p=b[b.length-1].c;PF.real.push({id:Date.now(),t,q,p,d});pfSave();port()})}
async function refreshAll(){if(RFL)return;RFL=1;const rb=$('#rfb');rb.classList.add('spin');const old={...D},os={...SRC};await Promise.all(Object.keys(D).map(async t=>{delete D[t];if(!(await load(t))){D[t]=old[t];SRC[t]=os[t]}}));
const Lm=Math.min(...U.map(t=>D[t].length));UR.length=0;for(let i=1;i<Lm;i++)UR.push(U.reduce((s,t)=>{const c=D[t],j=c.length-Lm+i;return s+c[j].c/c[j-1].c-1},0)/U.length);
LR0=Date.now();LR=clk();paperStep();if(RF.m=='i')loadAllI();home();radar();if($('#v2').classList.contains('on'))stock();if($('#v3').classList.contains('on'))port();rb.classList.remove('spin');RFL=0}
function mac(){const L=[['faiz','Faiz eğilimi (düşüş = +)'],['enf','Enflasyon eğilimi (düşüş = +)'],['risk','Küresel risk iştahı (VIX düşük = +)'],['kur','TL istikrarı (kur sakin = +)']];
$('#v4').innerHTML=`<div class="card"><h3>Makro etkenler (−2 … +2)</h3>${L.map(([k,n])=>`<div style="margin-bottom:10px">${n}: <b id="m_${k}">${M[k]}</b><input type="range" min="-2" max="2" step="1" value="${M[k]}" data-k="${k}"></div>`).join('')}<div class="note">Makro skor kısa vadeye %10, uzun vadeye %30 etki eder; bankalar faize 2,5× duyarlı. Piyasa rejimi (rapor): <b>${f(REG,0)}</b>.</div></div><div class="card"><h3>Geriye dönük test</h3><div class="note" style="margin-bottom:8px">Skorun geçmişte işe yarayıp yaramadığını gerçek veriyle ölçer (yaklaşık 10 sn sürer).</div><button class="pr" data-a="bt">TESTİ ÇALIŞTIR</button></div><div id="bo"></div><div class="card"><h3>Veri kaynakları</h3><div class="note">Fiyatlar sırayla Yahoo Finance, Stooq ve yerleşik günlük arşivden alınır; sahte veri kullanılmaz. Arşiv her iş günü akşamı GitHub'da otomatik yenilenir. Gün içi tarama (15 dk) Yahoo'dan, olmazsa GitHub'ın 15 dakikada bir yenilediği kopyadan okunur. Aracı kurum raporu (Ziraat Yatırım, ${RPT.tarih}) koddaki RPT bloğundan okunur; her gün yeni PDF'i bana vererek güncelleyebilirsin.</div></div>`;
document.querySelectorAll('#v4 input').forEach(i=>i.oninput=()=>{M[i.dataset.k]=+i.value;$('#m_'+i.dataset.k).textContent=i.value;home();radar()})}
const NV=[['⌂','Ana Sayfa'],['☰','Radar'],['◩','Hisse'],['▣','Portföy'],['⚙','Makro']];
function go(i){if(i==1&&LR0&&Date.now()-LR0>60000)refreshAll();if(i==3)port();document.querySelectorAll('.v').forEach((e,k)=>e.classList.toggle('on',k==i));$('#nv').innerHTML=NV.map((n,k)=>`<button class="${k==i?'on':''}" data-a="go:${k}"><b>${n[0]}</b>${n[1]}</button>`).join('');scrollTo(0,0)}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const[a,v]=el.dataset.a.split(':');
if(a=='go')go(+v);else if(a=='o'){ST.t=v;ST.tab='g';go(2);stock()}else if(a=='tab'){ST.tab=v;stock()}else if(a=='per'){ST.per=+v;stock()}else if(a=='rf'){RF.f=v;radar()}else if(a=='so'){RF.s=v;radar()}
else if(a=='qk'){RF.f=v=='rep'?'rep':'all';RF.s=v=='rep'?'c':v;RF.m=v=='st'?'i':'d';radar();go(1)}else if(a=='q'||a=='q2'){const t=$(a=='q'?'#q':'#tk').value.trim().toUpperCase();if(t){ST.t=t;ST.tab='g';go(2);stock()}}
else if(a=='rf0')refreshAll();else if(a=='pt'){PT.v=v;port()}else if(a=='pa')pfAdd();else if(a=='pd'){PF.real=PF.real.filter(p=>p.id!=v);pfSave();port()}else if(a=='pr'){if(confirm('Yapay portföy sıfırlansın mı?')){PF.paper[v]=null;paperStep();port()}}else if(a=='md'){RF.m=v;radar()}else if(a=='ri')loadAllI();else if(a=='rt')location.reload();else if(a=='bt'){$('#bo').innerHTML='<div class="card">Hesaplanıyor…</div>';setTimeout(bt,30)}});
let ty=-1,pd=0;addEventListener('touchstart',e=>{ty=scrollY<=0?e.touches[0].clientY:-1},{passive:true});
addEventListener('touchmove',e=>{if(ty<0)return;pd=e.touches[0].clientY-ty;const b=$('#ptr');b.style.height=pd>10?Math.min(44,pd/2.5)+'px':'0';b.textContent=pd>110?'Bırak: yenileniyor':pd>10?'↓ Yenilemek için çek':''},{passive:true});
addEventListener('touchend',()=>{if(ty>=0&&pd>110)refreshAll();const b=$('#ptr');b.style.height='0';b.textContent='';ty=-1;pd=0});

$('#ul').innerHTML=U.map(u=>`<option value="${u}">`).join('');go(0);pfInit();mac();
(async()=>{await Promise.all(U.map(load));for(let i=U.length-1;i>=0;i--)if(!D[U[i]])U.splice(i,1);
if(!U.length){$('#src').textContent='Veri yok';$('#v0').innerHTML=$('#v1').innerHTML='<div class="card"><b class="r">Gerçek veri alınamadı.</b><div class="note" style="margin:6px 0">Yahoo, Stooq ve yerel arşiv denendi. Uygulama sahte veri göstermez. Önizleme sayfası dış sitelere bağlanamaz; APK sürümünde çalışır.</div><button class="pr" data-a="rt">TEKRAR DENE</button></div>';return}
const Lm=Math.min(...U.map(t=>D[t].length));for(let i=1;i<Lm;i++)UR.push(U.reduce((s,t)=>{const c=D[t],j=c.length-Lm+i;return s+c[j].c/c[j-1].c-1},0)/U.length);LR0=Date.now();LR=clk();paperStep();home();radar();port()})();
