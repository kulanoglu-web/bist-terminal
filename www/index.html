<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>BIST Terminal</title>
<style>

:root[data-theme="dark"]{--bg:#07111f;--p:#0e1b2e;--b:#1b2d45;--t:#dbe6f5;--m:#7f93ad;--g:#22c55e;--r:#ef4444;--a:#f59e0b;--c:#3b82f6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:13px/1.45 system-ui,-apple-system,Roboto,sans-serif;padding-bottom:74px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--b)}
.hd{display:flex;align-items:center;gap:10px;padding:10px 12px}.lg{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,#ef4444,#b91c1c);display:grid;place-items:center;font-weight:800;color:#fff}.hd small{display:block;color:var(--m);font-size:11px}.hd .x{margin-left:auto;font-size:10px;color:var(--m);border:1px solid var(--b);border-radius:12px;padding:3px 8px}
.tape{display:flex;gap:14px;overflow-x:auto;padding:0 12px 7px;white-space:nowrap;font-size:11px}
main{padding:10px}.v{display:none}.v.on{display:block}

h3{margin:0 0 8px;font-size:12px;color:var(--m);font-weight:600;letter-spacing:.3px}
.g{color:var(--g)}.r{color:var(--r)}.a{color:var(--a)}.m{color:var(--m)}
table{width:100%;border-collapse:collapse}th{color:var(--m);font-weight:500;text-align:right;font-size:11px;padding:4px 3px}td{padding:7px 3px;text-align:right;border-top:1px solid var(--b);white-space:nowrap}th:first-child,td:first-child{text-align:left}tr[data-a]{cursor:pointer}
.pl{display:inline-block;min-width:62px;text-align:center;padding:4px 6px;border-radius:6px;font-size:11px;font-weight:800;color:#fff}.pl.g{background:#16a34a}.pl.r{background:#dc2626}.pl.a{background:#d97706}
.row{display:flex;gap:8px;margin-bottom:10px}input,button{font:inherit;color:var(--t);background:var(--p);border:1px solid var(--b);border-radius:10px;padding:10px}.row input{flex:1;text-transform:uppercase}
button.pr{background:var(--c);color:#fff;border:0;font-weight:700}
.chs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}.ch{border-radius:18px;padding:7px 14px;white-space:nowrap;color:var(--m)}.ch.on{background:var(--c);color:#fff;border-color:var(--c)}
.qk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.qk button{padding:10px 2px;font-size:11px;display:flex;flex-direction:column;gap:4px;align-items:center}.qk span{font-size:20px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.tile{background:var(--p);border:1px solid var(--b);border-radius:10px;padding:10px;display:flex;flex-direction:column}.tile b{font-size:17px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kv{background:var(--bg);border-radius:8px;padding:8px}.kv span{color:var(--m);font-size:11px;display:block}.kv b{font-size:15px}
canvas{width:100%;height:380px;display:block;border-radius:8px}.big{font-size:26px;font-weight:800}
.rng{height:6px;background:var(--b);border-radius:3px;position:relative;margin:10px 0 4px}.rng i{position:absolute;top:-4px;width:4px;height:14px;background:var(--c);border-radius:2px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--p);border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom,0px)}

input[type=range]{width:100%;padding:0}.note{font-size:11px;color:var(--m)}.scroll{overflow-x:auto}
</style></head><body>
<header><div class="hd"><div class="lg">BT</div><div><b>BIST Terminal</b><small>Piyasaları bir adım önde takip et</small></div><span class="x" id="src">yükleniyor</span></div><div class="tape" id="tape"></div></header>
<main><section class="v on" id="v0"></section><section class="v" id="v1"></section><section class="v" id="v2"></section><section class="v" id="v3"></section><section class="v" id="v4"></section></main>
<nav id="nv"></nav><datalist id="ul"></datalist>
<script>
const $=s=>document.querySelector(s),U=['THYAO','ASELS','GARAN','AKBNK','EREGL','KCHOL','BIMAS','TUPRS','SISE','FROTO','PGSUS','SAHOL','TCELL','YKBNK','OTKAR','TABGD'],BANK=['GARAN','AKBNK','YKBNK'];
// ZİRAAT YATIRIM TEKNİK ANALİZ RAPORU (7 Ekim 2026) — günlük güncellenebilir veri bloğu
const RPT={tarih:'7 Ekim 2026',
rec:{GARAN:{c:131.2,s1:135.2,s2:135.5,stop:129.9},OTKAR:{c:341.25,s1:351.5,s2:352,stop:337},TABGD:{c:224.9,s1:231.7,s2:232.1,stop:222.7}},
sum:{GARAN:{beta:1.18,z:.26,wk:127.32,mo:130.52,hi:131.4,lo:122.5,vol:2285,vm:4283},OTKAR:{beta:.67,z:.06,wk:322.6,mo:312.43,hi:357,lo:275,vol:316,vm:140},TABGD:{beta:.62,z:0,wk:222.2,mo:226.24,hi:229,lo:210.9,vol:71,vm:161}},
idx:[['XU100','BIST 100',12374,-.56,.7,-11.7,15.3],['XBANK','BIST Banka',16188,.66,.3,-2.5,11.9],['XUSIN','BIST Sınai',15864,-1.21,-1.5,-17.5,13.7],['XTUMY','BIST Tüm-100',48631,-1.13,-5.4,-34.8,-7.6]],
bist:{sup:[12260,12180,12085],res:[12440,12575,12680],y:'Endeks kısa vadeli ortalamaların üzerinde ama hacim düşük. 12.260 üstünde kalındıkça 12.440 direnci denenebilir; aksi halde ana destek 12.085. Yatay açılış bekleniyor.'},
viop:{sup:[15625,15465,15320],res:[15750,15900,16040],y:'Kontrat güç kazanmakta zorlanıyor ama desteklerin üzerinde. 15.625 korundukça 15.750 direnci, ardından kanal üst bandı hedeflenir; kırılırsa ana destek 15.320.'}};
const REG=(()=>{const x=RPT.idx[0];return Math.max(-60,Math.min(60,(x[2]>RPT.bist.sup[0]?15:-25)+x[5]*1.5+x[4]*3))})();
const D={},SRC={};let M={faiz:0,enf:0,risk:0,kur:0},UR=[],RF={f:'all',s:'c'},ST={t:'THYAO',tab:'g',per:66};
const f=(x,d=2)=>Number(x).toLocaleString('tr-TR',{minimumFractionDigits:d,maximumFractionDigits:d}),cl=(x,a=100)=>Math.max(-a,Math.min(a,x)),avg=(a,n)=>a.slice(-n).reduce((x,y)=>x+y,0)/Math.min(n,a.length),col=x=>x>0?'g':x<0?'r':'m';
const sd=(a,n)=>{const s=a.slice(-n),m=avg(s,n);return Math.sqrt(s.reduce((x,y)=>x+(y-m)**2,0)/s.length)||1},zs=(c,n)=>(c[c.length-1]-avg(c,n))/sd(c,n);
const Y=t=>t.includes('.')||t.includes('^')?t:t+'.IS';
async function J(u,x){const r=await fetch(u);if(!r.ok)throw 0;return x?r.text():r.json()}
const SRCF={
Yahoo:async t=>{let e;for(const h of['query1','query2']){try{const j=await J('https://'+h+'.finance.yahoo.com/v8/finance/chart/'+Y(t)+'?range=3y&interval=1d'),q=j.chart.result[0],z=q.indicators.quote[0];return q.timestamp.map((s,i)=>({t:s,o:z.open[i],c:z.close[i],h:z.high[i],l:z.low[i],v:z.volume[i]||1}))}catch(x){e=x}}throw e},
Stooq:async t=>(await J('https://stooq.com/q/d/l/?s='+t.toLowerCase()+'.tr&i=d',1)).trim().split('\n').slice(1).map(l=>{const a=l.split(',');return{t:Date.parse(a[0])/1000,o:+a[1],h:+a[2],l:+a[3],c:+a[4],v:+a[5]||1}}),
'Arşiv':t=>J('data/'+t+'.json')};
async function load(t){if(D[t])return D[t];for(const k of['Yahoo','Stooq','Arşiv']){try{const d=(await SRCF[k](t)).filter(b=>b.c>0&&b.o>0&&b.h>0&&b.l>0);if(d.length>=260){D[t]=d;SRC[t]=k;return d}}catch(e){}}SRC[t]='YOK';return null}
const ema=(a,n)=>{const k=2/(n+1);let e=a[0];return a.map((x,i)=>i?e=x*k+e*(1-k):e)};
function rsi(c,n=14){const o=Array(c.length).fill(null);let g=0,l=0;for(let i=1;i<c.length;i++){const d=c[i]-c[i-1],u=Math.max(d,0),w=Math.max(-d,0);if(i<=n){g+=u/n;l+=w/n}else{g=(g*(n-1)+u)/n;l=(l*(n-1)+w)/n}if(i>=n)o[i]=l==0?100:100-100/(1+g/l)}return o}
function atr(d,n=14){let a=0;const s=d.slice(-n-1);for(let i=1;i<s.length;i++)a+=Math.max(s[i].h-s[i].l,Math.abs(s[i].h-s[i-1].c),Math.abs(s[i].l-s[i-1].c));return a/n}
function bbw(c,i){const s=c.slice(i-19,i+1),m=avg(s,20),q=Math.sqrt(s.reduce((a,b)=>a+(b-m)**2,0)/20);return{m,u:m+2*q,l:m-2*q,w:4*q/m}}
function ind(d){const c=d.map(x=>x.c),n=c.length-1,R=rsi(c),e12=ema(c,12),e26=ema(c,26),m=e12.map((x,i)=>x-e26[i]),sg=ema(m,9),h=m.map((x,i)=>x-sg[i]),b=bbw(c,n),pb=(c[n]-b.l)/(b.u-b.l);
const ws=[];for(let j=Math.max(19,n-120);j<=n;j++)ws.push(bbw(c,j).w);const pct=ws.filter(x=>x<b.w).length/ws.length*100;
const tei=(c[n]-c[n-20])/c.slice(n-19).reduce((s,x,k)=>s+Math.abs(x-c[n-20+k]),0); // ÖZEL 1 Trend Verimliliği
const vsp=(100-pct)/100*Math.sign(c[n]-b.m); // ÖZEL 2 Sıkışma Baskısı
const s50=avg(c,50),vv=d.map(x=>x.v),vr=avg(vv,5)/avg(vv,50),vwe=(c[n]-s50)/sd(c,50)*vr; // ÖZEL 3 Hacim Ağırlıklı Yorgunluk
const z=(zs(c,21)+zs(c,63)+zs(c,250))/3,L=d[n],P=(L.h+L.l+L.c)/3,y=d.slice(-250);// Z-Skor: rapordaki yöntem (1-3-12 ay ort.)
return{c,n,r:R[n],R,h:h[n],hp:h[n-1],pb,b,pct,tei,vsp,vwe,vr,z,s5:avg(c,5),s20:avg(c,20),s21:avg(c,21),s50,s200:avg(c,200),p:c[n],mom:c[n]/c[Math.max(0,n-250)]-1,d1:c[n]/c[n-1]-1,at:atr(d),hi:Math.max(...y.map(x=>x.h)),lo:Math.min(...y.map(x=>x.l)),dh:L.h,dl:L.l,pv:{R2:P+L.h-L.l,R1:2*P-L.l,S1:2*P-L.h,S2:P-(L.h-L.l)}}}
function beta(t){if(RPT.sum[t])return RPT.sum[t].beta;const c=D[t].map(x=>x.c),n=Math.min(250,UR.length,c.length-2),a=[],b=[];for(let i=0;i<n;i++){a.push(c[c.length-1-i]/c[c.length-2-i]-1);b.push(UR[UR.length-1-i])}const ma=avg(a,n),mb=avg(b,n);let cv=0,vr=0;for(let i=0;i<n;i++){cv+=(a[i]-ma)*(b[i]-mb);vr+=(b[i]-mb)**2}return cv/vr}
function macro(t){const w=BANK.includes(t)?2.5:1.5;return cl((M.faiz*w+M.enf+M.risk*1.5+M.kur)/10*100+REG)}
function score(d,t,rs=0,live=true){const x=ind(d),rp=x.r<30?20:x.r>75?-20:(x.r-50)*.4,mp=x.h>0?(x.h>x.hp?22:8):(x.h>x.hp?-8:-22);
let st=cl(rp+mp+x.tei*35+x.vsp*20-cl(x.vwe,3)*8),lt=cl((x.s50>x.s200?20:-20)+(x.p>x.s200?15:-15)+cl(x.mom*100,40)*.75+rs*.5),mc=0,rk=0;
if(live){mc=macro(t);rk=RPT.rec[t]?20:0;st+=mc*.1+rk;lt+=mc*.3+cl(-x.z*6,12)}return{st:cl(st),lt:cl(lt),mc,rk,x}}
const sig=v=>v>40?['GÜÇLÜ AL','g']:v>15?['AL','g']:v<-40?['GÜÇLÜ SAT','r']:v<-15?['SAT','r']:['İZLE','a'],pl=v=>{const[a,c]=sig(v);return`<span class="pl ${c}">${a}</span>`},ch=(l,a,on)=>`<button class="ch ${on?'on':''}" data-a="${a}">${l}</button>`;
function rows(){const UM=U.reduce((s,t)=>s+ind(D[t]).mom,0)/U.length;return U.map(t=>{const sc=score(D[t],t,cl((ind(D[t]).mom-UM)*100,40));return{t,sc,x:sc.x,st:sc.st,lt:sc.lt,c:(sc.st+sc.lt)/2}})}
function home(){const R=rows().sort((a,b)=>b.c-a.c),top=R.slice(0,3),bot=R.slice(-3).reverse(),cd=o=>`<div class="kv" data-a="o:${o.t}" style="cursor:pointer"><b>${o.t}</b>${pl(o.c)}<span class="${col(o.x.d1)}">${f(o.x.d1*100)}%</span></div>`;
$('#v0').innerHTML=`<div class="row"><input id="q" placeholder="Hisse ara (ör. THYAO)" list="ul"><button class="pr" data-a="q">ARA</button></div>
<div class="qk">${[['⚡','Hızlı Tarama','c'],['📈','Kısa Vade','st'],['🏦','Uzun Vade','lt'],['📋','Rapor Listesi','rep']].map(([i,l,k])=>`<button data-a="qk:${k}"><span>${i}</span>${l}</button>`).join('')}</div>
<h3>Piyasa özeti · Ziraat Yatırım ${RPT.tarih}</h3><div class="tiles">${RPT.idx.map(i=>`<div class="tile"><span class="m">${i[1]}</span><b>${f(i[2],0)}</b><span class="${col(i[3])}">${i[3]>0?'+':''}${f(i[3])}% · Ay ${f(i[5],1)}%</span></div>`).join('')}</div>
<div class="card"><h3>Aracı kurum günlük öneri listesi × bizim skor</h3><table><thead><tr><th>Hisse</th><th>Kapanış</th><th>Satış</th><th>Stop</th><th>Skor</th></tr></thead>${Object.entries(RPT.rec).map(([t,r])=>`<tr data-a="o:${t}"><td><b>${t}</b></td><td>${f(r.c)}</td><td class="g">${f(r.s1)}</td><td class="r">${f(r.stop)}</td><td>${R.find(o=>o.t==t)?pl(R.find(o=>o.t==t).c):'-'}</td></tr>`).join('')}</table></div>
<div class="card"><h3>BIST 100 seviyeleri</h3>Destek <b class="g">${RPT.bist.sup.map(v=>f(v,0)).join(' · ')}</b><br>Direnç <b class="r">${RPT.bist.res.map(v=>f(v,0)).join(' · ')}</b><div class="note" style="margin-top:6px">${RPT.bist.y}</div></div>
<div class="card"><h3>VİOP 30 Ekim kontratı</h3>Destek <b class="g">${RPT.viop.sup.map(v=>f(v,0)).join(' · ')}</b><br>Direnç <b class="r">${RPT.viop.res.map(v=>f(v,0)).join(' · ')}</b><div class="note" style="margin-top:6px">${RPT.viop.y}</div></div>
<h3>Günün en güçlüleri</h3><div class="grid" style="margin-bottom:10px">${top.map(cd).join('')}</div><h3>En zayıflar</h3><div class="grid">${bot.map(cd).join('')}</div>`}
function radar(){const A=rows(),R=A.filter(o=>RF.f=='all'||(RF.f=='al'&&o.c>15)||(RF.f=='iz'&&Math.abs(o.c)<=15)||(RF.f=='sa'&&o.c<-15)||(RF.f=='rep'&&RPT.rec[o.t])).sort((a,b)=>b[RF.s]-a[RF.s]);
$('#tape').innerHTML=A.map(o=>`<span>${o.t} <span class="${col(o.x.d1)}">${o.x.d1>=0?'▲':'▼'}${f(Math.abs(o.x.d1)*100)}%</span></span>`).join('');const ks=[...new Set(U.map(t=>SRC[t]))],ls=D[U[0]].slice(-1)[0].t,dt=ls?new Date(ls*1000).toLocaleDateString('tr-TR'):'';$('#src').textContent=ks.join('+')+(dt?' · '+dt:'')+((Date.now()/1000-ls>518400)?' ⚠ eski':'');
$('#v1').innerHTML=`<div class="chs">${[['Tümü','all'],['AL','al'],['İZLE','iz'],['SAT','sa'],['Rapor','rep']].map(([l,k])=>ch(l,'rf:'+k,RF.f==k)).join('')}</div><div class="chs">${[['Birleşik','c'],['Kısa vade','st'],['Uzun vade','lt']].map(([l,k])=>ch('↕ '+l,'so:'+k,RF.s==k)).join('')}</div>
<div class="card"><table><thead><tr><th>Kod</th><th>Fiyat</th><th>Değ.</th><th>K</th><th>U</th><th>Sinyal</th></tr></thead>${R.map(o=>`<tr data-a="o:${o.t}"><td><b>${o.t}</b>${RPT.rec[o.t]?' <span class="a">★</span>':''}</td><td>${f(o.x.p)}</td><td class="${col(o.x.d1)}">${f(o.x.d1*100)}%</td><td class="${col(o.st)}">${f(o.st,0)}</td><td class="${col(o.lt)}">${f(o.lt,0)}</td><td>${pl(o.c)}</td></tr>`).join('')}</table></div><div class="note">★ aracı kurum listesinde. K/U: kısa/uzun vade skoru. Yatırım tavsiyesi değildir.</div>`}
function gauge(v){const[a,c]=sig(v),s=(v+100)/2,L=157;return`<svg viewBox="0 0 120 72" style="width:170px"><path d="M10 62A50 50 0 0 1 110 62" fill="none" stroke="var(--b)" stroke-width="10" stroke-linecap="round"/><path d="M10 62A50 50 0 0 1 110 62" fill="none" stroke="var(--${c})" stroke-width="10" stroke-linecap="round" stroke-dasharray="${L*s/100} 999"/><text x="60" y="52" text-anchor="middle" font-size="17" font-weight="800" fill="var(--${c})">${a}</text><text x="60" y="68" text-anchor="middle" font-size="8" fill="var(--m)">Güç %${f(s,0)}</text></svg>`}
async function stock(){const t=ST.t;$('#v2').innerHTML='<div class="card">Yükleniyor…</div>';const d=await load(t);if(!d){$('#v2').innerHTML='<div class="card r">'+t+' için gerçek veri alınamadı. Yahoo, Stooq ve arşiv denendi.</div>';return}
const UM=U.reduce((s,u)=>s+ind(D[u]).mom,0)/U.length,s=score(d,t,cl((ind(d).mom-UM)*100,40)),x=s.x,c=(s.st+s.lt)/2,K=(l,v,k='')=>`<div class="kv"><span>${l}</span><b class="${k}">${v}</b></div>`,tb=ST.tab,bt=beta(t);let h=`<div class="row"><input id="tk" value="${t}" list="ul"><button class="pr" data-a="q2">ARA</button></div><div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><b style="font-size:17px">${t}</b> <span class="m">${SRC[t]}${RPT.rec[t]?' · ★ rapor':''}</span><div class="big">${f(x.p)} ₺</div><span class="${col(x.d1)}">${x.d1>=0?'+':''}${f(x.d1*100)}%</span></div>${gauge(c)}</div></div><div class="chs">${[['g','Genel'],['c','Grafik'],['t','Teknik'],['r','Rapor']].map(([k,l])=>ch(l,'tab:'+k,tb==k)).join('')}</div>`;
