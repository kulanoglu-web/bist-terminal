async function port(){const v=PT.v;$('#v3').innerHTML=`<div class="chs">${[['Gerçek portföy','r'],['Yapay portföy','p']].map(([l,k])=>ch(l,'pt:'+k,v==k)).join('')}</div><div class="card"><h3>${v=='r'?'Aldığın hisseyi ekle':'Yapay portföye hisse ekle (denemek için)'}</h3><div class="row"><input id="pf_t" value="${ST.t}" list="ul"><input id="pf_q" type="number" inputmode="numeric" placeholder="Adet"></div><div class="row"><input id="pf_p" type="number" step="0.01" inputmode="decimal" placeholder="${v=='r'?'Giriş fiyatı (boşsa güncel)':'Fiyat (boşsa güncel)'}"><input id="pf_d" type="date" value="${today()}"></div><button class="pr" data-a="pa" style="width:100%">${v=='r'?'PORTFÖYE EKLE':'YAPAYA EKLE'}</button></div><div id="pfl"><div class="card">Yükleniyor…</div></div>`;
const S=PF.paper,L=v=='r'?PF.real:S.pos;await Promise.all(L.map(p=>load(p.t)));const I=L.map(p=>({p,i:pinfo(p.t,p.q,p.p,p.d)})).filter(o=>o.i);let h='';
const tv=I.reduce((s,o)=>s+o.i.val,0),tc=I.reduce((s,o)=>s+o.i.cost,0),cash=v=='p'?S.cash:0,tot=tv+cash,adv=I.map(o=>({o,a:advice(o.i,tv?o.i.val/tv:0)}));
if(!I.length)h=`<div class="card note">${v=='r'?'Henüz pozisyon yok. Yukarıdan hisse, adet, giriş fiyatı ve tarih gir; ya da Radar ve Hisse sayfasındaki ＋ ile ekle.':'Yapay portföy boş. Radar listesindeki ＋ ile ya da yukarıdan hisse ekleyerek "bu hisseyi alsaydım ne olurdu" diye izleyebilirsin.'}</div>`+(v=='p'?`<div class="tiles"><div class="tile"><span class="m">Nakit</span><b>${TL(S.cash)}</b></div></div>`:'');
else{const pl=tv-tc;h=`<div class="tiles"><div class="tile"><span class="m">${v=='p'?'Toplam değer (nakit dahil)':'Portföy değeri'}</span><b>${TL(tot)}</b><span class="m">${v=='p'?'başlangıç 100.000 ₺':'maliyet '+TL(tc)}</span></div><div class="tile"><span class="m">Kâr / Zarar${v=='p'?' (hisseler)':''}</span><b class="${col(pl)}">${TL(pl)}</b>${tc?pc(tv/tc-1):''}${v=='p'?'<span class="m">toplam '+pc(tot/100000-1).replace(/<[^>]+>/g,'')+'</span>':''}</div></div>
<div class="card"><h3>Dağılım ve kâr/zarar</h3>${pie(I.map(o=>({t:o.i.t,val:o.i.val,pl:o.i.cur/o.i.p-1})),v=='p'&&S.cash>0?{t:'Nakit',val:S.cash,col:'#94a3b8'}:null)}</div>
<div class="card scroll"><h3>Pozisyonlar${v=='p'?' · nakit '+TL(S.cash):''}</h3><table>${PH}${I.map(o=>prow(o.i,v=='r'?`<button data-a="pd:${o.p.id}" style="padding:4px 8px">✕</button>`:`<button data-a="ps:${o.p.id}" style="padding:4px 8px">Sat</button>`)).join('')}</table></div>
<div class="card"><h3>${v=='r'?'Öneriler':'Gösterge ne diyor?'}</h3>${adv.map(({o,a})=>`<div style="margin-bottom:8px"><b>${o.i.t}</b> ${a.map(x=>`<span class="pl ${x[1]}" style="min-width:0;padding:2px 7px;margin-left:3px">${x[0]}</span>`).join('')}<div class="note">${a.map(x=>x[2]).join(' ')}</div></div>`).join('')}${(()=>{const sc={};I.forEach(o=>{const k=secOf(o.i.t);if(k)sc[k]=(sc[k]||0)+o.i.val});const top=Object.entries(sc).sort((a,b)=>b[1]-a[1])[0],mine=new Set(I.map(o=>o.i.t)),pick=rows().filter(o=>o.lq!==0&&/AL/.test(o.sg[0])&&!mine.has(o.t)).sort((a,b)=>b.c-a.c).slice(0,3);
return(top&&top[1]/tv>.4?`<div class="note">⚠ Portföyün %${f(top[1]/tv*100,0)} kadarı tek sektörde (${top[0]}); çeşitlendirmeyi düşün.</div>`:'')+(I.length<4?'<div class="note">⚠ Az sayıda hisse var; 5-8 farklı hisse riski dağıtır.</div>':'')+(pick.length?`<div class="note">Portföyünde olmayan AL sinyalleri: <b>${pick.map(o=>o.t).join(', ')}</b></div>`:'')})()}<div class="note">Öneriler gösterge çıktısıdır, kişisel yatırım tavsiyesi değildir. Durum: STOP = zirveden 2,5×ATR geri çekilme; ZAYIF = trend skoru SAT.</div></div>`}
if(v=='p'){h+=(S.log.length?`<div class="card"><h3>Kapanan işlemler</h3><table>${S.log.slice(-8).reverse().map(l=>`<tr><td><b>${l.t}</b></td><td>${dmy(l.d)}→${dmy(l.xd)}</td><td>${pc(l.pl)}</td></tr>`).join('')}</table></div>`:'')+'<button data-a="pr" style="margin-bottom:8px">Sıfırla (tüm hisseleri sil)</button>'}
h+=BKCARD;const el=$('#pfl');if(el)el.innerHTML=(v=='r'?alrHTML():'')+h}
function pfAdd(){const t=$('#pf_t').value.trim().toUpperCase(),q=+$('#pf_q').value,d=$('#pf_d').value;let p=+$('#pf_p').value;if(!t||!(q>0)||!d)return alert('Hisse, adet ve tarih gerekli.');load(t).then(b=>{if(!b)return alert(t+' için veri alınamadı.');if(!(p>0))p=b[b.length-1].c;
if(PT.v=='r')PF.real.push({id:Date.now(),t,q,p,d});else{const c=q*p*(1+FEE);if(c>PF.paper.cash)return alert('Nakit yetersiz: '+TL(PF.paper.cash));PF.paper.cash-=c;if(!PF.paper.start)PF.paper.start=d;PF.paper.pos.push({id:Date.now(),t,q,p,d})}pfSave();port();pfCheck()})}
function paperSell(id){const S=PF.paper,i=S.pos.findIndex(p=>p.id==id);if(i<0)return;const p=S.pos[i],c=lastB(p.t).c,pr=p.q*c*(1-FEE);S.cash+=pr;S.log.push({t:p.t,q:p.q,p:p.p,x:c,d:p.d,xd:today(),pl:pr/(p.q*p.p*(1+FEE))-1});S.pos.splice(i,1);pfSave();port()}
const APPV=6,verHTML=()=>SCAN&&SCAN.ver>APPV?'<div class="card" style="border-color:var(--a)"><b class="a">Yeni sürüm var</b><div class="note">Veri formatı değişti, bu uygulama eski kaldı. Güncel APK: github.com/kulanoglu-web/bist-terminal/releases/tag/latest</div></div>':'';
async function pfCheck(){const P=PF.real;if(!P.length){ALR=[];updAlr();return}await Promise.all(P.map(p=>load(p.t)));const out=[];
P.forEach(p=>{const i=pinfo(p.t,p.q,p.p,p.d);if(!i)return;const x=i.x,w=[];if(x.p<x.l55)w.push(['r','55 günlük dip kırıldı ('+f(x.l55)+' altında)']);else if(x.don==-1)w.push(['r','20 günlük dip kırıldı ('+f(x.l20)+' altında)']);if(i.cur<i.tr)w.push(['r','zirveden 2,5×ATR geri çekilme (stop '+f(i.tr)+')']);if(/SAT/.test(i.sg[0]))w.push(['a','model puanı düşük (yüzdelik '+f(i.s.pm*100,0)+')']);
if(w.length)out.push({t:p.t,lv:w.some(q=>q[0]=='r')?'r':'a',msg:w.map(q=>q[1]).join(' · '),pl:i.cur/i.p-1})});ALR=out;updAlr()}
const alrHTML=()=>ALR.length?`<div class="card" style="border-color:var(--r)"><h3 class="r">⚠ Portföy uyarıları (${ALR.length})</h3>${ALR.map(a=>`<div style="margin-bottom:6px" data-a="go:3"><b>${a.t}</b> <span class="pl ${a.lv}" style="min-width:0;padding:2px 7px">${a.lv=='r'?'SAT ÖNERİSİ':'DİKKAT'}</span> <span class="${col(a.pl)}">${a.pl>0?'+':''}${f(a.pl*100,1)}%</span><div class="note">${a.msg}</div></div>`).join('')}<div class="note">Kontrol, uygulamayı açtığında ve ↻ ile yenilediğinde yapılır; arka planda bildirim göndermez.</div></div>`:'',updAlr=()=>{const e=$('#alr');if(e)e.innerHTML=verHTML()+alrHTML();renderNav()};
const BKCARD='<div class="card"><h3>Yedek (güncellemede veri kaybolmasın)</h3><div class="note" style="margin-bottom:6px">Portföyün telefonda saklanır. Yedeği kopyalayıp not defterine/mesaja yapıştır; gerekirse buraya yapıştırıp yükle.</div><div class="row"><button data-a="bkx">Yedeği göster/kopyala</button><button data-a="bkl">Yedekten yükle</button></div><textarea id="bkt" rows="4" style="display:none;width:100%;background:var(--bg);color:var(--t);border:1px solid var(--b);border-radius:8px;padding:8px"></textarea></div>';
function bkShow(){const t=$('#bkt');t.style.display='block';t.value=JSON.stringify({v:1,real:PF.real,paper:PF.paper});t.select();try{navigator.clipboard&&navigator.clipboard.writeText(t.value)}catch(e){}}
function bkLoad(){const t=$('#bkt');if(t.style.display=='none'||!t.value.trim()){t.style.display='block';t.value='';return alert('Yedek metnini kutuya yapıştırıp tekrar “Yedekten yükle”ye bas.')}try{const j=JSON.parse(t.value);if(!j.real||!j.paper)throw 0;PF.real=j.real;PF.paper=j.paper;pfSave();port();pfCheck();alert('Yedek yüklendi.')}catch(e){alert('Geçersiz yedek metni.')}}
async function refreshAll(){if(RFL)return;RFL=1;const rb=$('#rfb');rb.classList.add('spin');const keep=new Set([ST.t,...PF.real.map(p=>p.t),...PF.paper.pos.map(p=>p.t)]),reload=async L=>{const old={...D},os={...SRC};await Promise.all(L.map(async t=>{delete D[t];if(!(await load(t))&&old[t]){D[t]=old[t];SRC[t]=os[t]}}))};
await loadScan();if(SCAN)await reload([...keep]);else{await reload(Object.keys(D));const Lm=Math.min(...U.map(t=>D[t].length));UR.length=0;for(let i=1;i<Lm;i++)UR.push(U.reduce((s,t)=>{const c=D[t],j=c.length-Lm+i;return s+c[j].c/c[j-1].c-1},0)/U.length)}
LR0=Date.now();LR=clk();LBT=0;if(RF.m=='i')loadAllI();home();radar();mac();pfCheck();if($('#v2').classList.contains('on'))stock();if($('#v3').classList.contains('on'))port();rb.classList.remove('spin');RFL=0}

${karne()}<div class="card"><h3>Aracı kurum görünümü · ${RPT.tarih}</h3>BIST 100 destek <b class="g">${RPT.bist.sup.map(v=>f(v,0)).join(' · ')}</b><br>direnç <b class="r">${RPT.bist.res.map(v=>f(v,0)).join(' · ')}</b><div class="note" style="margin-top:6px">${RPT.bist.y}</div></div>
<div class="card"><h3>Geriye dönük test</h3><div class="note" style="margin-bottom:8px">Skorun geçmişte işe yarayıp yaramadığını gerçek veriyle ölçer (yaklaşık 15 sn sürer).</div><button class="pr" data-a="bt">TESTİ ÇALIŞTIR</button></div><div id="bo"></div>
