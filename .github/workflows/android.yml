name: Build APK
on:
  push:
    paths-ignore:
      - 'scripts/**'
      - '.github/workflows/data.yml'
      - '.github/workflows/research.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Sabit imza anahtari
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          test -n "$KS" || { echo "DEBUG_KEYSTORE_B64 yok"; exit 1; }
          mkdir -p ~/.android
          echo "$KS" | base64 -d > ~/.android/debug.keystore
          cp ~/.android/debug.keystore android/debug.keystore
      - name: Surum numarasi
        run: sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"5.${{ github.run_number }}\"/" android/app/build.gradle
      - name: Imza ayari (sabit anahtar)
        run: |
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  debug {
                      storeFile file("$rootDir/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          }
          EOF
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Imza dogrula
        run: |
          FP=$(keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep "SHA256:" | head -1 | awk '{print $2}')
          echo "APK imza: $FP"
          test "$FP" = "0D:B9:A7:F6:0E:54:9C:2B:1E:BB:0C:03:CA:05:4F:03:FF:4F:93:8C:02:F7:DA:3C:A7:34:7D:7B:62:31:20:5F" || { echo "IMZA SABIT ANAHTAR DEGIL"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: bist-terminal-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: APK yayinla (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk BistTerminal.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest BistTerminal.apk --title "BIST Terminal (son surum)" --notes "Surum 5.${{ github.run_number }} (sabit imza: guncelleme eskisinin ustune kurulur)" --latest
