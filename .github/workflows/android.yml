name: Build APK
on:
  push:
  schedule:
    - cron: '30 15 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: node scripts/fetch-data.mjs
        continue-on-error: true
      - name: Arşivi kaydet
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add -f www/data
          git diff --cached --quiet || (git commit -m "veri arşivi [skip ci]" && git pull --rebase -q && git push)
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: bist-terminal-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: APK yayınla (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk BistTerminal.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest BistTerminal.apk --title "BIST Terminal (son sürüm)" --notes "Otomatik derleme" --latest
