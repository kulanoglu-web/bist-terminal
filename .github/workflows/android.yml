name: Build APK
on:
  push:
    paths-ignore:
      - 'scripts/**'
      - '.github/workflows/data.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Sabit imza anahtari
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          test -n "$KS" || { echo "DEBUG_KEYSTORE_B64 yok"; exit 1; }
          mkdir -p ~/.android
          echo "$KS" | base64 -d > ~/.android/debug.keystore
      - name: Surum numarasi
        run: sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"5.${{ github.run_number }}\"/" android/app/build.gradle
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: bist-terminal-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: APK yayinla (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk BistTerminal.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest BistTerminal.apk --title "BIST Terminal (son surum)" --notes "Surum 5.${{ github.run_number }} (imza: sabit anahtar)" --latest
