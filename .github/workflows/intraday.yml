name: Gun ici veri
on:
  schedule:
    - cron: '*/15 7-15 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: intraday
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-intraday.mjs
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add -f www/data
          git diff --cached --quiet || (git commit -m "gun ici veri [skip ci]" && git pull --rebase -q && git push)
