name: Arastirma verisi
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/research-data.mjs
      - name: Yayinla (research dali)
        run: |
          cd rout
          git init -q -b research
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -q -m "arastirma verisi"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" research
